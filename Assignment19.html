<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Mini Projects</title>

    <style>
        body {
            font-family: Arial;
            background: #f0eaff;
            padding: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 450px;
            border-radius: 12px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            background: #6c4ab6;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1 style="text-align:center;">JavaScript Mini Projects</h1>

<div class="box">

    <h2>Project 1: Simple Calculator</h2>

    <input type="number" id="num1" placeholder="First Number">

    <input type="number" id="num2" placeholder="Second Number">

    <br><br>

    <button onclick="calculate('+')">Add</button>
    <button onclick="calculate('-')">Subtract</button>
    <button onclick="calculate('*')">Multiply</button>
    <button onclick="calculate('/')">Divide</button>

    <h3 id="calcResult"></h3>

</div>

<div class="box">

    <h2>Project 2: Number Guessing Game</h2>

    <p>Guess a number between 1 and 10.</p>

    <input type="number" id="guess" placeholder="Enter your guess">

    <br><br>

    <button onclick="checkGuess()">Check Guess</button>

    <h3 id="gameResult"></h3>

</div>

<script>

// Project 1: Calculator

function calculate(operator) {

    let a = Number(document.getElementById("num1").value);

    let b = Number(document.getElementById("num2").value);

    let answer;

    if (document.getElementById("num1").value === "" ||
        document.getElementById("num2").value === "") {

        document.getElementById("calcResult").textContent =
            "Please enter both numbers.";

        return;
    }

    if (operator === "+") {
        answer = a + b;
    }

    else if (operator === "-") {
        answer = a - b;
    }

    else if (operator === "*") {
        answer = a * b;
    }

    else if (operator === "/") {

        if (b === 0) {
            document.getElementById("calcResult").textContent =
                "Cannot divide by zero.";

            return;
        }

        answer = a / b;
    }

    document.getElementById("calcResult").textContent =
        "Result: " + answer;
}


// Project 2: Number Guessing Game

let randomNumber = Math.floor(Math.random() * 10) + 1;

function checkGuess() {

    let guess = Number(document.getElementById("guess").value);

    let result = document.getElementById("gameResult");

    if (document.getElementById("guess").value === "") {
        result.textContent = "Please enter a number.";
    }

    else if (guess < 1 || guess > 10) {
        result.textContent = "Enter a number between 1 and 10.";
    }

    else if (guess === randomNumber) {
        result.textContent = "Congratulations! Correct Guess!";
    }

    else if (guess < randomNumber) {
        result.textContent = "Too Low! Try Again.";
    }

    else {
        result.textContent = "Too High! Try Again.";
    }
}

</script>

</body>
</html>
