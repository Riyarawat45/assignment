<!DOCTYPE html>
<html>
<head>
    <title>Assignment 36 - Element Selection</title>
</head>
<body>

    <h1 id="heading">Welcome to JavaScript</h1>

    <p class="description">This is first paragraph.</p>
    <p class="description">This is second paragraph.</p>

    <div id="box">
        <h2>Student Information</h2>
        <p class="student">Name: Riya</p>
        <p class="student">Course: BCA AI</p>
    </div>

    <button id="changeBtn">Change Content</button>

    <script>
        // Select by ID
        const heading = document.getElementById("heading");

        // Select by class
        const descriptions = document.getElementsByClassName("description");

        // Select first matching element
        const firstStudent = document.querySelector(".student");

        // Select all matching elements
        const allStudents = document.querySelectorAll(".student");

        // Select box
        const box = document.getElementById("box");

        console.log("Heading:", heading);
        console.log("Descriptions:", descriptions);
        console.log("First Student:", firstStudent);
        console.log("All Students:", allStudents);
        console.log("Box:", box);

        // Button functionality
        document.getElementById("changeBtn").addEventListener("click", function() {
            heading.textContent = "JavaScript DOM Selection Completed!";
        });
    </script>

</body>
</html>
