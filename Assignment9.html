<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        header {
            background: #3949ab;
            color: white;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 90vh;
        }

        .sidebar {
            background: #222;
            color: white;
            padding: 25px;
        }

        .sidebar h2 {
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 0;
        }

        .sidebar a:hover {
            color: yellow;
        }

        .main {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0002;
        }

        .card h3 {
            color: #3949ab;
            margin-bottom: 15px;
        }

        @media(max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .sidebar {
                text-align: center;
            }

        }

    </style>
</head>

<body>

    <header>
        <h1>Student Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>Menu</h2>

            <a href="#">Dashboard</a>
            <a href="#">My Courses</a>
            <a href="#">Assignments</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>

        </aside>

        <main class="main">

            <h2>Welcome, Riya!</h2>

            <p>Here is your learning progress.</p>

            <div class="cards">

                <div class="card">
                    <h3>Courses</h3>
                    <h2>5</h2>
                    <p>Enrolled Courses</p>
                </div>

                <div class="card">
                    <h3>Assignments</h3>
                    <h2>12</h2>
                    <p>Completed Tasks</p>
                </div>

                <div class="card">
                    <h3>Progress</h3>
                    <h2>75%</h2>
                    <p>Learning Progress</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
