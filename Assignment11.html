<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Grid</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
        }

        header {
            background: #3949ab;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 35px;
        }

        .product-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product-card h3 {
            margin: 15px;
        }

        .price {
            color: #3949ab;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #3949ab;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #222;
        }

        @media(max-width: 768px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 500px) {

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>Online Shopping Store</h1>

        <p>Our Latest Products</p>

    </header>

    <div class="products">

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Laptop" alt="Laptop">

            <h3>Laptop</h3>

            <p class="price">₹45,000</p>

            <button onclick="buyProduct('Laptop')">Buy Now</button>

        </div>

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Mobile" alt="Mobile">

            <h3>Smartphone</h3>

            <p class="price">₹15,000</p>

            <button onclick="buyProduct('Smartphone')">Buy Now</button>

        </div>

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Headphones" alt="Headphones">

            <h3>Headphones</h3>

            <p class="price">₹999</p>

            <button onclick="buyProduct('Headphones')">Buy Now</button>

        </div>

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Watch" alt="Watch">

            <h3>Smart Watch</h3>

            <p class="price">₹2,000</p>

            <button onclick="buyProduct('Smart Watch')">Buy Now</button>

        </div>

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Shoes" alt="Shoes">

            <h3>Shoes</h3>

            <p class="price">₹1,500</p>

            <button onclick="buyProduct('Shoes')">Buy Now</button>

        </div>

        <div class="product-card">

            <img src="https://placehold.co/200x180?text=Bag" alt="Bag">

            <h3>Backpack</h3>

            <p class="price">₹850</p>

            <button onclick="buyProduct('Backpack')">Buy Now</button>

        </div>

    </div>

    <script>

        function buyProduct(name) {

            alert(name + " selected successfully!");

        }

    </script>

</body>
</html>
