<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Styled Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #3949ab;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: yellow;
        }

        main {
            padding: 30px;
            text-align: center;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #0002;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning HTML and CSS</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <div class="card">
            <h2>About Me</h2>
            <p>Hello! I am a BCA Artificial Intelligence student.</p>
            <p>I am learning web development using HTML and CSS.</p>
        </div>

        <div class="card">
            <h2>My Learning Goals</h2>
            <p>Learn HTML, CSS and JavaScript.</p>
            <p>Build creative and responsive websites.</p>
        </div>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
