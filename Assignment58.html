<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS Revision Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9;
        }

        header {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            display: flex;
            gap: 20px;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            flex: 1;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
        }

        footer {
            text-align: center;
            background: #34495e;
            color: white;
            padding: 20px;
        }

        @media(max-width: 600px) {
            .container {
                flex-direction: column;
            }

            nav a {
                display: block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p>HTML and CSS Revision Challenge</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="container">

        <section class="card" id="about">
            <h2>About Me</h2>
            <p>
                I am Riya, a BCA Artificial Intelligence student.
                I enjoy learning web development and programming.
            </p>
        </section>

        <section class="card" id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
            </ul>
        </section>

    </div>

    <div class="container">
        <section class="card" id="contact">
            <h2>Contact Me</h2>
            <p>Email: riyarawat4511@gmail.com</p>
            <button>Contact</button>
        </section>
    </div>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
