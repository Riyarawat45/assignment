<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Strings Problems</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf5f0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #247a55;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #247a55;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        #output {
            margin-top: 20px;
            line-height: 2;
            background: #f0f8f3;
            padding: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Arrays and Strings Problems</h1>

    <p>Enter numbers separated by commas:</p>

    <input type="text" id="numbers" placeholder="Example: 10, 20, 30, 40">

    <p>Enter a word or sentence:</p>

    <input type="text" id="textInput" placeholder="Enter text">

    <br>

    <button onclick="solveProblems()">Solve Problems</button>

    <div id="output"></div>

</div>

<script>

// Problem 1: Reverse Array
function reverseArray(arr) {

    return [...arr].reverse();

}


// Problem 2: Find Maximum
function findMaximum(arr) {

    return Math.max(...arr);

}


// Problem 3: Find Minimum
function findMinimum(arr) {

    return Math.min(...arr);

}


// Problem 4: Reverse String
function reverseString(str) {

    return str.split("").reverse().join("");

}


// Problem 5: Check Palindrome
function isPalindrome(str) {

    let cleaned = str.toLowerCase().replace(/[^a-z0-9]/g, "");

    let reversed = reverseString(cleaned);

    return cleaned === reversed;

}


// Main Function
function solveProblems() {

    let numberText = document.getElementById("numbers").value;

    let text = document.getElementById("textInput").value;

    let output = document.getElementById("output");

    if (numberText.trim() === "" || text.trim() === "") {

        output.textContent = "Please enter both numbers and text.";

        return;
    }

    let numbers = numberText.split(",").map(Number);

    if (numbers.some(number => !Number.isFinite(number))) {

        output.textContent = "Please enter valid numbers separated by commas.";

        return;
    }

    output.innerHTML =

        "<b>Original Array:</b> " + numbers.join(", ") + "<br>" +

        "<b>Reversed Array:</b> " + reverseArray(numbers).join(", ") + "<br>" +

        "<b>Maximum Number:</b> " + findMaximum(numbers) + "<br>" +

        "<b>Minimum Number:</b> " + findMinimum(numbers) + "<br>" +

        "<b>Original String:</b> " + text + "<br>" +

        "<b>Reversed String:</b> " + reverseString(text) + "<br>" +

        "<b>Palindrome:</b> " + isPalindrome(text);

}

</script>

</body>
</html>
