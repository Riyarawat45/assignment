<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Photo Gallery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0fa;
        }

        header {
            background: #764ba2;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }

        @media(max-width: 768px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 500px) {

            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>My Photo Gallery</h1>

        <p>Beautiful Moments and Memories</p>

    </header>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Nature">

        <img src="https://picsum.photos/id/1011/400/300" alt="Mountain">

        <img src="https://picsum.photos/id/1018/400/300" alt="Travel">

        <img src="https://picsum.photos/id/1025/400/300" alt="Animal">

        <img src="https://picsum.photos/id/1035/400/300" alt="Forest">

        <img src="https://picsum.photos/id/1043/400/300" alt="Landscape">

    </div>

</body>
</html>
