<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeaff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #6c4ab6;
            text-align: center;
        }

        p {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>Student Profile</h1>
        <div id="studentDetails"></div>
    </div>

    <script>
        // String variable
        let studentName = "Riya Rawat";

        // Number variable
        let age = 20;

        // String variable
        let course = "BCA Artificial Intelligence";

        // Number variable
        let semester = 3;

        // Boolean variable
        let isStudent = true;

        // Array variable
        let skills = ["HTML", "CSS", "JavaScript"];

        // Object variable
        let college = {
            name: "Invertis University",
            city: "Bareilly"
        };

        // Display student information
        document.getElementById("studentDetails").innerHTML =
            "<p><b>Name:</b> " + studentName + "</p>" +
            "<p><b>Age:</b> " + age + "</p>" +
            "<p><b>Course:</b> " + course + "</p>" +
            "<p><b>Semester:</b> " + semester + "</p>" +
            "<p><b>Is Student:</b> " + isStudent + "</p>" +
            "<p><b>Skills:</b> " + skills.join(", ") + "</p>" +
            "<p><b>College:</b> " + college.name + "</p>" +
            "<p><b>City:</b> " + college.city + "</p>";
    </script>

</body>
</html>
