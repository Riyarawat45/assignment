
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e0e7ff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 320px;
            padding: 25px;
            margin: 20px;
            background-color: white;
            border: 2px solid #c7d2fe;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 20px #a5b4fc;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: #4f46e5;
            color: white;
            font-size: 35px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: #312e81;
            margin-bottom: 5px;
        }

        .role {
            color: #6366f1;
            font-weight: bold;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
        }

        .skills span {
            display: inline-block;
            background-color: #eef2ff;
            color: #4338ca;
            padding: 7px 10px;
            margin: 4px;
            border-radius: 20px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #312e81;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="avatar">RR</div>

        <h2>RIYA RAWAT</h2>
        <p class="role">BCA AI Student</p>

        <p class="description">
            I am a student interested in programming,
            web development and learning new technologies.
        </p>

        <h3>My Skills</h3>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
        </div>

        <button onclick="alert('Hello! Nice to meet you.')">
            Say Hello
        </button>
    </div>
</body>
</html>
