<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Loop Problems</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeaff;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #6c4ab6;
        }

        button {
            padding: 10px 20px;
            background: #6c4ab6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        pre {
            background: #f2f2f2;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Loop Practice</h1>

    <button onclick="runPrograms()">Run Programs</button>

    <pre id="output"></pre>

</div>

<script>

function runPrograms() {

    let result = "";

    // 1. Print numbers from 1 to 10
    result += "Numbers from 1 to 10:\n";

    for (let i = 1; i <= 10; i++) {
        result += i + " ";
    }

    // 2. Print even numbers
    result += "\n\nEven Numbers:\n";

    for (let i = 2; i <= 20; i += 2) {
        result += i + " ";
    }

    // 3. Multiplication table
    result += "\n\nTable of 5:\n";

    for (let i = 1; i <= 10; i++) {
        result += "5 x " + i + " = " + (5 * i) + "\n";
    }

    // 4. Sum of numbers from 1 to 10
    let sum = 0;
    let i = 1;

    while (i <= 10) {
        sum += i;
        i++;
    }

    result += "\nSum from 1 to 10: " + sum;

    // 5. Countdown using do-while
    result += "\n\nCountdown:\n";

    let count = 5;

    do {
        result += count + " ";
        count--;
    } while (count >= 1);

    document.getElementById("output").textContent = result;
}

</script>

</body>
</html>
