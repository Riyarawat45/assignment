<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Listing</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        header {
            background-color: #3949ab;
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 40px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product h3 {
            margin: 15px 0;
        }

        .price {
            color: #3949ab;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #3949ab;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #222;
        }

        @media (max-width: 768px) {

            .container {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>My Shopping Store</h1>

        <p>Explore Our Products</p>

    </header>

    <div class="container">

        <div class="product">

            <img src="https://placehold.co/200x180?text=Headphones" alt="Headphones">

            <h3>Headphones</h3>

            <p class="price">₹999</p>

            <button onclick="addToCart('Headphones')">
                Add to Cart
            </button>

        </div>

        <div class="product">

            <img src="https://placehold.co/200x180?text=Watch" alt="Watch">

            <h3>Smart Watch</h3>

            <p class="price">₹1499</p>

            <button onclick="addToCart('Smart Watch')">
                Add to Cart
            </button>

        </div>

        <div class="product">

            <img src="https://placehold.co/200x180?text=Shoes" alt="Shoes">

            <h3>Sports Shoes</h3>

            <p class="price">₹1999</p>

            <button onclick="addToCart('Sports Shoes')">
                Add to Cart
            </button>

        </div>

    </div>

    <script>

        function addToCart(product) {

            alert(product + " added to cart!");

        }

    </script>

</body>
</html>
