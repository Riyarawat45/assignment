<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #0003;
        }

        h2 {
            color: #3949ab;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3949ab;
            color: white;
            border: none;
            border-radius: 7px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #222;
        }

        p {
            margin-top: 15px;
            color: #555;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Login Here</h2>

        <form onsubmit="login(event)">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        function login(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;

            document.getElementById("message").innerText =
                "Welcome! Login form submitted for " + email;

        }

    </script>

</body>
</html>
