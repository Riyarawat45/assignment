<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mathematical Functions</title>

    <style>
        body {
            font-family: Arial;
            background: #e9f0ff;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 80%;
        }

        button {
            background: #3157a4;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Math Utility Functions</h1>

    <input type="number" id="num1" placeholder="Enter First Number">

    <input type="number" id="num2" placeholder="Enter Second Number">

    <br><br>

    <button onclick="showResults()">Calculate</button>

    <div id="result"></div>

</div>

<script>

// Function 1: Addition
function add(a, b) {
    return a + b;
}

// Function 2: Subtraction
function subtract(a, b) {
    return a - b;
}

// Function 3: Multiplication
function multiply(a, b) {
    return a * b;
}

// Function 4: Division
function divide(a, b) {

    if (b === 0) {
        return "Cannot divide by zero";
    }

    return a / b;
}

// Function 5: Average
function average(a, b) {
    return (a + b) / 2;
}

// Display all results
function showResults() {

    let a = Number(document.getElementById("num1").value);

    let b = Number(document.getElementById("num2").value);

    if (document.getElementById("num1").value === "" ||
        document.getElementById("num2").value === "") {

        document.getElementById("result").textContent =
            "Please enter both numbers.";

        return;
    }

    document.getElementById("result").innerHTML =

        "Addition: " + add(a, b) + "<br>" +

        "Subtraction: " + subtract(a, b) + "<br>" +

        "Multiplication: " + multiply(a, b) + "<br>" +

        "Division: " + divide(a, b) + "<br>" +

        "Average: " + average(a, b);
}

</script>

</body>
</html>
