<!DOCTYPE html>
<html>
<head>
    <title>Assignment 30 - Product Object</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            padding: 30px;
        }

        .card {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Product Details</h1>

    <h2 id="name"></h2>

    <p id="price"></p>
    <p id="brand"></p>
    <p id="color"></p>
    <p id="storage"></p>
    <p id="ram"></p>
    <p id="warranty"></p>

    <button onclick="showProduct()">Show Product</button>

</div>

<script>

    // Product object with nested specifications
    const product = {
        name: "Smartphone",
        brand: "Samsung",
        price: 25000,

        specifications: {
            color: "Black",
            storage: "128 GB",
            ram: "8 GB",
            warranty: "1 Year"
        }
    };

    function showProduct() {

        document.getElementById("name").textContent =
            product.name;

        document.getElementById("price").textContent =
            "Price: ₹" + product.price;

        document.getElementById("brand").textContent =
            "Brand: " + product.brand;

        document.getElementById("color").textContent =
            "Color: " + product.specifications.color;

        document.getElementById("storage").textContent =
            "Storage: " + product.specifications.storage;

        document.getElementById("ram").textContent =
            "RAM: " + product.specifications.ram;

        document.getElementById("warranty").textContent =
            "Warranty: " + product.specifications.warranty;
    }

</script>

</body>
</html>
