<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            background: #34495e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        .task-section {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
        }

        button {
            padding: 12px 20px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        @media(max-width: 600px) {
            .task-section {
                flex-direction: column;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Manage your daily activities</p>
    </header>

    <div class="container">
        <h2>My Tasks</h2>

        <div class="task-section">
            <input type="text" placeholder="Enter your task">
            <button>Add Task</button>
        </div>
    </div>

</body>
</html>
