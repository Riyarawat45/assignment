<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeaff;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #6c4ab6;
        }

        input {
            padding: 12px;
            width: 65%;
        }

        button {
            padding: 12px;
            background: #6c4ab6;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            padding: 10px;
            margin: 8px 0;
            background: #f2efff;
        }

        .delete {
            float: right;
            background: #e74c3c;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Shopping List Manager</h1>

    <input type="text" id="itemInput" placeholder="Enter shopping item">

    <button onclick="addItem()">Add Item</button>

    <h3>My Shopping List</h3>

    <ul id="shoppingList"></ul>

</div>

<script>

let shoppingItems = [];

// Add Item
function addItem() {

    let input = document.getElementById("itemInput");

    let item = input.value.trim();

    if (item === "") {
        alert("Please enter an item.");
        return;
    }

    shoppingItems.push(item);

    input.value = "";

    displayItems();

    console.log("Item Added:", item);

    console.log("Shopping List:", shoppingItems);
}

// Display Items
function displayItems() {

    let list = document.getElementById("shoppingList");

    list.innerHTML = "";

    shoppingItems.forEach(function(item, index) {

        let li = document.createElement("li");

        li.textContent = item;

        let deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";

        deleteButton.className = "delete";

        deleteButton.onclick = function() {
            removeItem(index);
        };

        li.appendChild(deleteButton);

        list.appendChild(li);

    });
}

// Remove Item
function removeItem(index) {

    let removedItem = shoppingItems.splice(index, 1);

    console.log("Removed Item:", removedItem[0]);

    displayItems();

}

</script>

</body>
</html>
