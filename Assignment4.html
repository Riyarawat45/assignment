<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .landing {
            min-height: 100vh;
            background: linear-gradient(120deg, #3949ab, #9c65c5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 650px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        button {
            background-color: white;
            color: #3949ab;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <section class="landing">

        <div class="content">

            <h1>Welcome to My Learning Journey</h1>

            <p>
                Explore the world of web development.
                Learn HTML, CSS and JavaScript
                and create amazing websites.
            </p>

            <button onclick="alert('Welcome!')">
                Get Started
            </button>

        </div>

    </section>

</body>
</html>
